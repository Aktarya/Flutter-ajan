name: Otonom APK Uretici ve Altyapi Kurucu

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Java Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Kalici Proje Dosyalarini Uret ve Depoya Geri Yükle
      run: |
        # Eğer pubspec.yaml depoda yoksa, sıfırdan kalıcı proje dosyalarını üret
        if [ ! -f "pubspec.yaml" ]; then
          echo "Kalıcı proje dosyaları bulunamadı. Üretiliyor..."
          
          # Hatalı --force bayrağı kaldırıldı, standart ve doğru kullanım:
          flutter create . --project-name flutter_ajani
          
          # Dışarıda duran main.dart dosyasını lib/ klasörüne taşı
          mkdir -p lib
          if [ -f "main.dart" ]; then
            mv main.dart lib/main.dart
          fi
          
          # GitHub Actions botuna kimlik ver ve kalıcı olarak depoya pushla
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Altyapı: Kalıcı Flutter proje dosyaları sunucu tarafından eklendi"
          git push origin main
          echo "BAŞARILI: Proje dosyaları kalıcı olarak ana depoya gönderildi!"
        else
          echo "Proje dosyaları zaten mevcut, doğrudan derleme aşamasına geçiliyor."
        fi

    - name: Paketleri Getir (Kutuphane Kurulumu)
      run: flutter pub get

    - name: APK Derle
      run: flutter build apk --release --target-platform android-arm64

    - name: APK Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: Ajan_APK
        path: build/app/outputs/flutter-apk/app-release.apk